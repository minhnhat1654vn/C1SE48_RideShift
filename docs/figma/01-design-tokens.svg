  <g id="section-aqi-legend-sample">
    <text x="440" y="1330" font-size="13" font-weight="700" fill="#061009" letter-spacing="1">8 · LEGEND TRÊN BẢN ĐỒ</text>
    <rect x="440" y="1344" width="230" height="136" rx="10" fill="#FFFFFF" stroke="#D7E1D9" opacity="0.96"/>
    <text x="454" y="1364" font-size="10" font-weight="600" fill="#061009">Chất lượng không khí (AQI)</text>
    <rect x="454" y="1374" width="12" height="12" rx="3" fill="#22C55E"/><text x="472" y="1384" font-size="10" fill="#061009">Tốt</text><text x="656" y="1384" font-size="9" fill="#606D64" text-anchor="end">0–50</text>
    <rect x="454" y="1391" width="12" height="12" rx="3" fill="#FACC15"/><text x="472" y="1401" font-size="10" fill="#061009">Trung bình</text><text x="656" y="1401" font-size="9" fill="#606D64" text-anchor="end">51–100</text>
    <rect x="454" y="1408" width="12" height="12" rx="3" fill="#F97316"/><text x="472" y="1418" font-size="10" fill="#061009">Kém</text><text x="656" y="1418" font-size="9" fill="#606D64" text-anchor="end">101–150</text>
    <rect x="454" y="1425" width="12" height="12" rx="3" fill="#EF4444"/><text x="472" y="1435" font-size="10" fill="#061009">Xấu</text><text x="656" y="1435" font-size="9" fill="#606D64" text-anchor="end">151–200</text>
    <rect x="454" y="1442" width="12" height="12" rx="3" fill="#A855F7"/><text x="472" y="1452" font-size="10" fill="#061009">Rất xấu</text><text x="656" y="1452" font-size="9" fill="#606D64" text-anchor="end">201–300</text>
    <rect x="454" y="1459" width="12" height="12" rx="3" fill="#7F1D1D"/><text x="472" y="1469" font-size="10" fill="#061009">Nguy hại</text><text x="656" y="1469" font-size="9" fill="#606D64" text-anchor="end">trên 300</text>
