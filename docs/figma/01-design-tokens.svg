    <circle cx="60" cy="1382" r="5" fill="none" stroke="#00884B" stroke-width="2"/><circle cx="60" cy="1382" r="1.6" fill="#00884B"/>
    <text x="76" y="1387" font-size="13" fill="#061009">Cầu Long Biên</text>
    <rect x="400" y="1362" width="220" height="40" rx="10" fill="#FFFFFF" stroke="#D7E1D9"/><text x="416" y="1387" font-size="13" fill="#061009">Xe máy xăng</text>
    <path d="M596 1378 L604 1378 L600 1386 Z" fill="#606D64"/>
    <g id="switch-sample">
      <rect x="660" y="1370" width="44" height="24" rx="12" fill="#00884B"/><circle cx="692" cy="1382" r="10" fill="#FFFFFF"/>
      <text x="716" y="1387" font-size="13" fill="#061009">Mô hình AQI</text>
    </g>
    <g id="slider-sample">
