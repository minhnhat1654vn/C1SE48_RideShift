    <rect x="40" y="1066" width="96" height="56" rx="10" fill="#FFFFFF" stroke="#D7E1D9"/><text x="40" y="1140" font-size="10" fill="#606D64">rounded-lg · 10px</text>
    <rect x="160" y="1066" width="96" height="56" rx="14" fill="#FFFFFF" stroke="#D7E1D9"/><text x="160" y="1140" font-size="10" fill="#606D64">rounded-xl · 14px</text>
