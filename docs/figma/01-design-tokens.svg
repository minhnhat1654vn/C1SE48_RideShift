  <g id="page-footer-note">
    <text x="40" y="1530" font-size="10" fill="#606D64">Giá trị HEX là quy đổi từ token OKLCH trong globals.css — khi sửa token, cập nhật đồng bộ cả tài liệu này và bộ bản vẽ Figma.</text>
