      <rect x="148" y="1258" width="196" height="26" rx="13" fill="#FFFBEB" stroke="#FE9A00"/><text x="246" y="1275" font-size="11" font-weight="600" fill="#92400E" text-anchor="middle">Một phần trong vùng LEZ</text>
      <rect x="356" y="1258" width="104" height="26" rx="13" fill="#FEE2E2"/><text x="408" y="1275" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="middle">Trong vùng</text>
      <rect x="472" y="1258" width="58" height="26" rx="13" fill="#FEE2E2"/><text x="501" y="1275" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="middle">Cấm</text>
      <rect x="542" y="1258" width="106" height="26" rx="13" fill="#FFFBEB" stroke="#FE9A00"/><text x="595" y="1275" font-size="11" font-weight="600" fill="#92400E" text-anchor="middle">Có điều kiện</text>
      <rect x="660" y="1258" width="108" height="26" rx="13" fill="#E7F4E9"/><text x="714" y="1275" font-size="11" font-weight="600" fill="#00884B" text-anchor="middle">Đã ghi nhận</text>
      <rect x="780" y="1258" width="150" height="26" rx="13" fill="#EBF3EC"/><text x="855" y="1275" font-size="11" font-weight="600" fill="#606D64" text-anchor="middle">Nguồn: Open-Meteo</text>
    </g>
  </g>

