    <rect x="40" y="1196" width="220" height="44" rx="10" fill="#00884B"/><text x="150" y="1223" font-size="14" font-weight="600" fill="#F8FBF8" text-anchor="middle">Phân tích hành trình</text>
    <rect x="280" y="1196" width="130" height="44" rx="10" fill="#FFFFFF" stroke="#D7E1D9"/><text x="345" y="1223" font-size="14" font-weight="600" fill="#061009" text-anchor="middle">Đổi chiều</text>
    <text x="440" y="1223" font-size="14" font-weight="600" fill="#606D64">Làm mới</text>
