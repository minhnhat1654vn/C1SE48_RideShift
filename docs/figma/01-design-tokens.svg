<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1560" viewBox="0 0 1200 1560" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ECFDF5"/><stop offset="0.5" stop-color="#F8FBF8"/><stop offset="1" stop-color="#F0FDFA"/>
    </linearGradient>
  </defs>

  <rect id="canvas-bg" width="1200" height="1560" fill="#F8FBF8"/>

  <g id="page-header">
    <text x="40" y="56" font-size="26" font-weight="700" fill="#061009">RideShift — Design Tokens</text>
    <text x="40" y="80" font-size="12" fill="#606D64">Bộ token dùng chung cho Figma và code (src/app/globals.css · src/lib/aqi-visual.ts) · Nhóm C1SE.48</text>
  </g>

  <!-- ============ SECTION 1: THEME COLORS ============ -->
  <g id="section-theme-colors">
    <text x="40" y="128" font-size="13" font-weight="700" fill="#061009" letter-spacing="1">1 · MÀU CHỦ ĐỀ (LIGHT THEME)</text>

    <g id="swatch-row-1">
      <rect x="40" y="142" width="272" height="56" rx="10" fill="#F8FBF8" stroke="#D7E1D9"/><text x="40" y="216" font-size="11" font-weight="600" fill="#061009">background</text><text x="40" y="230" font-size="10" fill="#606D64">#F8FBF8 · oklch(0.985 0.005 150)</text>
      <rect x="336" y="142" width="272" height="56" rx="10" fill="#FFFFFF" stroke="#D7E1D9"/><text x="336" y="216" font-size="11" font-weight="600" fill="#061009">card</text><text x="336" y="230" font-size="10" fill="#606D64">#FFFFFF · oklch(1 0 0)</text>
      <rect x="632" y="142" width="272" height="56" rx="10" fill="#00884B"/><text x="632" y="216" font-size="11" font-weight="600" fill="#061009">primary — thương hiệu</text><text x="632" y="230" font-size="10" fill="#606D64">#00884B · oklch(0.55 0.14 155)</text>
      <rect x="928" y="142" width="272" height="56" rx="10" fill="#F8FBF8" stroke="#D7E1D9"/><text x="928" y="216" font-size="11" font-weight="600" fill="#061009">primary-foreground</text><text x="928" y="230" font-size="10" fill="#606D64">#F8FBF8 · chữ trên nền primary</text>
    </g>
    <g id="swatch-row-2">
      <rect x="40" y="262" width="272" height="56" rx="10" fill="#E7F4E9"/><text x="40" y="336" font-size="11" font-weight="600" fill="#061009">secondary</text><text x="40" y="350" font-size="10" fill="#606D64">#E7F4E9 · nút phụ, nền nhấn nhẹ</text>
      <rect x="336" y="262" width="272" height="56" rx="10" fill="#EBF3EC"/><text x="336" y="336" font-size="11" font-weight="600" fill="#061009">muted</text><text x="336" y="350" font-size="10" fill="#606D64">#EBF3EC · footer, pill nav, skeleton</text>
      <rect x="632" y="262" width="272" height="56" rx="10" fill="#606D64"/><text x="632" y="336" font-size="11" font-weight="600" fill="#061009">muted-foreground</text><text x="632" y="350" font-size="10" fill="#606D64">#606D64 · chữ phụ, nhãn</text>
      <rect x="928" y="262" width="272" height="56" rx="10" fill="#D7F4DC"/><text x="928" y="336" font-size="11" font-weight="600" fill="#061009">accent</text><text x="928" y="350" font-size="10" fill="#606D64">#D7F4DC · hover, highlight</text>
    </g>
    <g id="swatch-row-3">
      <rect x="40" y="382" width="272" height="56" rx="10" fill="#061009"/><text x="40" y="456" font-size="11" font-weight="600" fill="#061009">foreground</text><text x="40" y="470" font-size="10" fill="#606D64">#061009 · chữ chính</text>
      <rect x="336" y="382" width="272" height="56" rx="10" fill="#E7000B"/><text x="336" y="456" font-size="11" font-weight="600" fill="#061009">destructive</text><text x="336" y="470" font-size="10" fill="#606D64">#E7000B · lỗi, trạng thái Cấm</text>
      <rect x="632" y="382" width="272" height="56" rx="10" fill="#D7E1D9"/><text x="632" y="456" font-size="11" font-weight="600" fill="#061009">border / input</text><text x="632" y="470" font-size="10" fill="#606D64">#D7E1D9 · viền card, input</text>
      <rect x="928" y="382" width="272" height="56" rx="10" fill="#389560"/><text x="928" y="456" font-size="11" font-weight="600" fill="#061009">ring</text><text x="928" y="470" font-size="10" fill="#606D64">#389560 · vòng focus bàn phím</text>
    </g>
    <g id="hero-gradient-swatch">
      <rect x="40" y="500" width="1160" height="40" rx="10" fill="url(#heroGrad)" stroke="#D7E1D9"/>
      <text x="56" y="525" font-size="11" font-weight="600" fill="#061009">hero-gradient — emerald-50 → background → teal-50 (banner giới thiệu trang Planner)</text>
    </g>
  </g>

  <!-- ============ SECTION 2: AQI PALETTE ============ -->
  <g id="section-aqi-palette">
    <text x="40" y="584" font-size="13" font-weight="700" fill="#061009" letter-spacing="1">2 · BẢNG MÀU AQI (CHUẨN HÓA TOÀN ỨNG DỤNG)</text>
    <g id="aqi-swatches">
      <rect x="40" y="600" width="158" height="48" rx="8" fill="#22C55E"/><text x="40" y="666" font-size="11" font-weight="600" fill="#061009">Tốt</text><text x="40" y="680" font-size="10" fill="#606D64">0–50 · #22C55E</text>
      <rect x="206" y="600" width="158" height="48" rx="8" fill="#FACC15"/><text x="206" y="666" font-size="11" font-weight="600" fill="#061009">Trung bình</text><text x="206" y="680" font-size="10" fill="#606D64">51–100 · #FACC15</text>
      <rect x="372" y="600" width="158" height="48" rx="8" fill="#F97316"/><text x="372" y="666" font-size="11" font-weight="600" fill="#061009">Kém</text><text x="372" y="680" font-size="10" fill="#606D64">101–150 · #F97316</text>
      <rect x="538" y="600" width="158" height="48" rx="8" fill="#EF4444"/><text x="538" y="666" font-size="11" font-weight="600" fill="#061009">Xấu</text><text x="538" y="680" font-size="10" fill="#606D64">151–200 · #EF4444</text>
      <rect x="704" y="600" width="158" height="48" rx="8" fill="#A855F7"/><text x="704" y="666" font-size="11" font-weight="600" fill="#061009">Rất xấu</text><text x="704" y="680" font-size="10" fill="#606D64">201–300 · #A855F7</text>
      <rect x="870" y="600" width="158" height="48" rx="8" fill="#7F1D1D"/><text x="870" y="666" font-size="11" font-weight="600" fill="#061009">Nguy hại</text><text x="870" y="680" font-size="10" fill="#606D64">trên 300 · #7F1D1D</text>
      <rect x="1036" y="600" width="158" height="48" rx="8" fill="#94A3B8"/><text x="1036" y="666" font-size="11" font-weight="600" fill="#061009">Không rõ</text><text x="1036" y="680" font-size="10" fill="#606D64">— · #94A3B8</text>
    </g>
    <text x="40" y="708" font-size="11" fill="#606D64">Lớp bản đồ hiển thị dạng trường mượt liên tục (nội suy IDW giữa các băng, blend màu tại biên), cắt theo ranh giới Hà Nội, opacity 0.6 — giống bản đồ thời tiết.</text>
  </g>

  <!-- ============ SECTION 3: CHART COLORS ============ -->
  <g id="section-chart-colors">
    <text x="40" y="748" font-size="13" font-weight="700" fill="#061009" letter-spacing="1">3 · MÀU BIỂU ĐỒ (ADMIN · RECHARTS)</text>
    <g id="chart-swatches">
      <rect x="40" y="764" width="224" height="44" rx="8" fill="#00884B"/><text x="40" y="826" font-size="11" font-weight="600" fill="#061009">chart-1 · #00884B</text>
      <rect x="274" y="764" width="224" height="44" rx="8" fill="#57A45B"/><text x="274" y="826" font-size="11" font-weight="600" fill="#061009">chart-2 · #57A45B</text>
      <rect x="508" y="764" width="224" height="44" rx="8" fill="#94AB39"/><text x="508" y="826" font-size="11" font-weight="600" fill="#061009">chart-3 · #94AB39</text>
      <rect x="742" y="764" width="224" height="44" rx="8" fill="#C8AD3F"/><text x="742" y="826" font-size="11" font-weight="600" fill="#061009">chart-4 · #C8AD3F</text>
      <rect x="976" y="764" width="224" height="44" rx="8" fill="#C65D26"/><text x="976" y="826" font-size="11" font-weight="600" fill="#061009">chart-5 · #C65D26</text>
    </g>
  </g>

  <!-- ============ SECTION 4: TYPOGRAPHY ============ -->
  <g id="section-typography">
    <text x="40" y="872" font-size="13" font-weight="700" fill="#061009" letter-spacing="1">4 · TYPOGRAPHY — GEIST SANS / INTER</text>
    <text x="40" y="906" font-size="20" font-weight="700" fill="#061009">Lựa chọn thông minh vì một Hà Nội trong lành hơn</text>
    <text x="760" y="906" font-size="10" fill="#606D64">text-xl · 700 · tiêu đề hero</text>
    <text x="40" y="938" font-size="16" font-weight="600" fill="#061009">Kế hoạch hành trình</text>
    <text x="760" y="938" font-size="10" fill="#606D64">text-base · 600 · tiêu đề card</text>
    <text x="40" y="964" font-size="14" fill="#061009">RideShift tính toán tuyến đường, kiểm tra vùng LEZ và xếp hạng các phương án di chuyển.</text>
    <text x="760" y="964" font-size="10" fill="#606D64">text-sm · 400 · nội dung</text>
    <text x="40" y="988" font-size="12" fill="#606D64">AQI cập nhật lúc 10:00 (Asia/Ho_Chi_Minh) · 9.860 ₫</text>
    <text x="760" y="988" font-size="10" fill="#606D64">text-xs · 400 · nhãn phụ</text>
    <text x="40" y="1008" font-size="11" fill="#606D64">Cố vấn chuyển đổi giao thông thông minh</text>
    <text x="760" y="1008" font-size="10" fill="#606D64">text-[11px] · tagline</text>
  </g>

