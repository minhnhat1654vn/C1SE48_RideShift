<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="mG4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00884B"/></marker>
  </defs>
  <rect id="page-bg" width="1440" height="1080" fill="#F8FBF8"/>

  <text x="60" y="46" font-size="24" font-weight="700" fill="#061009">Dialogs &amp; Popups — Bộ hộp thoại</text>
  <text x="60" y="70" font-size="12" fill="#606D64">Popup chi tiết AQI · chi tiết phương án · hộp xác nhận xóa · toast · tooltip — khớp components/rideshift/{map-view, results, admin/*}.tsx</text>

  <!-- ============ DIALOG 1 : AQI DETAIL ============ -->
  <g id="dialog-aqi">
    <text x="60" y="106" font-size="11" font-weight="700" fill="#061009">① DIALOG CHI TIẾT KHÔNG KHÍ — mở khi click vùng trên bản đồ (bước ④)</text>
    <rect x="60" y="120" width="460" height="520" rx="12" fill="#061009" opacity="0.32"/>
    <rect x="95" y="150" width="390" height="460" rx="16" fill="#FFFFFF" stroke="#D7E1D9" stroke-width="1.5"/>
    <text x="119" y="186" font-size="15" font-weight="700" fill="#061009">Chất lượng không khí</text>
    <text x="119" y="206" font-size="10.5" fill="#606D64">Khu vực: Quận Hoàn Kiếm, Hà Nội · cập nhật 14:05 hôm nay</text>
    <text x="425" y="186" font-size="16" fill="#606D64" text-anchor="end">×</text>
    <line x1="95" y1="220" x2="485" y2="220" stroke="#EFF4F0"/>

    <text x="119" y="262" font-size="40" font-weight="700" fill="#EA580C">132</text>
    <rect x="185" y="234" width="64" height="26" rx="13" fill="#FFF4E5"/>
    <text x="217" y="251" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">Kém</text>
    <text x="119" y="282" font-size="9.5" fill="#606D64">Chỉ số AQI (Mỹ) · Open-Meteo</text>

    <rect x="119" y="296" width="366" height="10" rx="5" fill="#EFF4F0"/>
    <rect x="119" y="296" width="80" height="10" rx="5" fill="#22C55E"/>
    <rect x="199" y="296" width="80" height="10" rx="5" fill="#FACC15"/>
    <rect x="279" y="296" width="80" height="10" rx="5" fill="#F97316"/>
    <rect x="359" y="296" width="80" height="10" rx="5" fill="#EF4444"/>
    <rect x="439" y="296" width="46" height="10" rx="5" fill="#A855F7"/>
    <circle cx="312" cy="301" r="7" fill="#FFFFFF" stroke="#EA580C" stroke-width="2.5"/>
    <text x="119" y="322" font-size="8" fill="#606D64">0</text>
    <text x="302" y="322" font-size="8" fill="#606D64" text-anchor="middle">100</text>
    <text x="485" y="322" font-size="8" fill="#606D64" text-anchor="end">300+</text>

    <text x="119" y="356" font-size="10.5" font-weight="700" fill="#061009">Thông số chi tiết</text>
    <text x="119" y="380" font-size="10" fill="#061009">PM2.5</text>
    <rect x="220" y="370" width="200" height="8" rx="4" fill="#EFF4F0"/><rect x="220" y="370" width="120" height="8" rx="4" fill="#F97316"/>
    <text x="465" y="380" font-size="10" font-weight="600" fill="#061009" text-anchor="end">48 µg/m³</text>
    <text x="119" y="406" font-size="10" fill="#061009">PM10</text>
    <rect x="220" y="396" width="200" height="8" rx="4" fill="#EFF4F0"/><rect x="220" y="396" width="132" height="8" rx="4" fill="#F97316"/>
    <text x="465" y="406" font-size="10" font-weight="600" fill="#061009" text-anchor="end">76 µg/m³</text>
    <text x="119" y="432" font-size="10" fill="#061009">O₃</text>
    <rect x="220" y="422" width="200" height="8" rx="4" fill="#EFF4F0"/><rect x="220" y="422" width="48" height="8" rx="4" fill="#FACC15"/>
    <text x="465" y="432" font-size="10" font-weight="600" fill="#061009" text-anchor="end">24 µg/m³</text>
    <text x="119" y="458" font-size="10" fill="#061009">NO₂</text>
    <rect x="220" y="448" width="200" height="8" rx="4" fill="#EFF4F0"/><rect x="220" y="448" width="62" height="8" rx="4" fill="#FACC15"/>
    <text x="465" y="458" font-size="10" font-weight="600" fill="#061009" text-anchor="end">31 µg/m³</text>

    <rect x="119" y="478" width="366" height="72" rx="10" fill="#FFF4E5"/>
    <text x="133" y="500" font-size="10" font-weight="700" fill="#92400E">Khuyến nghị</text>
    <text x="133" y="518" font-size="9.5" fill="#92400E">Hạn chế hoạt động ngoài trời kéo dài; người nhạy cảm nên đeo</text>
    <text x="133" y="534" font-size="9.5" fill="#92400E">khẩu trang. Ưu tiên phương tiện công cộng / xe điện hôm nay.</text>

    <rect x="119" y="566" width="366" height="30" rx="8" fill="#FFFFFF" stroke="#D7E1D9"/>
    <text x="302" y="585" font-size="10.5" font-weight="600" fill="#061009" text-anchor="middle">Đóng</text>
  </g>

  <!-- ============ DIALOG 2 : MODE DETAIL ============ -->
  <g id="dialog-mode">
    <text x="560" y="106" font-size="11" font-weight="700" fill="#061009">② DIALOG CHI TIẾT PHƯƠNG ÁN — mở khi bấm “Chi tiết” (bước ⑥)</text>
    <rect x="560" y="120" width="460" height="520" rx="12" fill="#061009" opacity="0.32"/>
    <rect x="595" y="150" width="390" height="460" rx="16" fill="#FFFFFF" stroke="#D7E1D9" stroke-width="1.5"/>

    <circle cx="643" cy="196" r="24" fill="#D7F4DC"/>
    <rect x="631" y="188" width="24" height="14" rx="3" fill="none" stroke="#00884B" stroke-width="1.6"/>
    <circle cx="637" cy="205" r="3" fill="#00884B"/><circle cx="649" cy="205" r="3" fill="#00884B"/>
    <text x="681" y="192" font-size="15" font-weight="700" fill="#061009">Xe buýt</text>
    <text x="681" y="210" font-size="10.5" fill="#606D64">Hạng 1/7 · phù hợp nhất với ưu tiên của bạn</text>
    <text x="961" y="192" font-size="16" fill="#606D64" text-anchor="end">×</text>

    <rect x="619" y="230" width="342" height="8" rx="4" fill="#EFF4F0"/>
    <rect x="619" y="230" width="280" height="8" rx="4" fill="#00884B"/>
    <text x="619" y="254" font-size="9.5" fill="#606D64">Điểm TOPSIS <tspan font-weight="700" fill="#00884B">0.82</tspan> — closeness tới phương án lý tưởng</text>

    <rect x="619" y="270" width="163" height="64" rx="10" fill="#F8FBF8" stroke="#D7E1D9"/>
    <text x="633" y="292" font-size="9" fill="#606D64">Thời gian</text>
    <text x="633" y="314" font-size="14" font-weight="700" fill="#061009">25 phút</text>
    <text x="633" y="328" font-size="8" fill="#8CA092">gồm chờ 10′</text>
    <rect x="798" y="270" width="163" height="64" rx="10" fill="#F8FBF8" stroke="#D7E1D9"/>
    <text x="812" y="292" font-size="9" fill="#606D64">Chi phí</text>
    <text x="812" y="314" font-size="14" font-weight="700" fill="#061009">7.000 ₫</text>
    <text x="812" y="328" font-size="8" fill="#8CA092">vé lượt</text>
    <rect x="619" y="344" width="163" height="64" rx="10" fill="#F8FBF8" stroke="#D7E1D9"/>
    <text x="633" y="366" font-size="9" fill="#606D64">Phát thải</text>
    <text x="633" y="388" font-size="14" font-weight="700" fill="#061009">42 g CO₂/km</text>
    <text x="633" y="402" font-size="8" fill="#16A34A">−96% so với xe máy xăng</text>
    <rect x="798" y="344" width="163" height="64" rx="10" fill="#F2FBF4" stroke="#B9DFC6"/>
    <text x="812" y="366" font-size="9" fill="#606D64">Vùng LEZ</text>
    <text x="812" y="388" font-size="13" font-weight="700" fill="#16A34A">Được phép ✓</text>
    <text x="812" y="402" font-size="8" fill="#606D64">toàn tuyến, mọi khung giờ</text>

    <rect x="619" y="424" width="342" height="76" rx="10" fill="#F2FBF4"/>
    <text x="633" y="446" font-size="10" font-weight="700" fill="#09311B">Ưu điểm</text>
    <text x="633" y="464" font-size="9.5" fill="#09311B">· Rẻ nhất sau xe đạp/đi bộ · không lo tìm chỗ gửi xe</text>
    <text x="633" y="480" font-size="9.5" fill="#09311B">· Đi làn riêng qua điểm nóng ùn tắc · phát thải thấp</text>
    <rect x="619" y="508" width="342" height="58" rx="10" fill="#FFF4E5"/>
    <text x="633" y="530" font-size="10" font-weight="700" fill="#92400E">Cần cân nhắc</text>
    <text x="633" y="548" font-size="9.5" fill="#92400E">· Có bước chờ 10′ · giờ cao điểm có thể đông</text>

    <rect x="619" y="576" width="200" height="34" rx="10" fill="#00884B"/>
    <text x="719" y="597" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Chọn phương án này ⑦</text>
    <rect x="829" y="576" width="132" height="34" rx="10" fill="#FFFFFF" stroke="#D7E1D9"/>
    <text x="895" y="597" font-size="10.5" fill="#061009" text-anchor="middle">Đóng</text>
  </g>

  <!-- ============ DIALOG 3 : DELETE CONFIRM ============ -->
  <g id="dialog-delete">
    <text x="1060" y="106" font-size="11" font-weight="700" fill="#061009">③ XÁC NHẬN XÓA (AlertDialog) — bước ⑫</text>
    <rect x="1060" y="120" width="320" height="520" rx="12" fill="#061009" opacity="0.32"/>
    <rect x="1075" y="220" width="290" height="250" rx="16" fill="#FFFFFF" stroke="#D7E1D9" stroke-width="1.5"/>
    <circle cx="1220" cy="268" r="24" fill="#FDECEC"/>
    <path d="M1220 256 L1232 278 L1208 278 Z" fill="none" stroke="#DC2626" stroke-width="1.8"/>
    <line x1="1220" y1="264" x2="1220" y2="271" stroke="#DC2626" stroke-width="1.8"/>
    <circle cx="1220" cy="275" r="1.2" fill="#DC2626"/>
    <text x="1220" y="318" font-size="14" font-weight="700" fill="#061009" text-anchor="middle">Xóa vùng LEZ này?</text>
    <text x="1220" y="342" font-size="9.5" fill="#606D64" text-anchor="middle">Vùng «Vùng LEZ vành đai 1» và toàn bộ quy định</text>
    <text x="1220" y="357" font-size="9.5" fill="#606D64" text-anchor="middle">chính sách gắn với vùng sẽ bị xóa vĩnh viễn.</text>
    <text x="1220" y="372" font-size="9.5" font-weight="600" fill="#B91C1C" text-anchor="middle">(Constraint: onDelete = Cascade)</text>
    <rect x="1095" y="396" width="120" height="34" rx="10" fill="#FFFFFF" stroke="#D7E1D9"/>
    <text x="1155" y="417" font-size="10.5" fill="#061009" text-anchor="middle">Hủy</text>
    <rect x="1225" y="396" width="120" height="34" rx="10" fill="#DC2626"/>
    <text x="1285" y="417" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Xóa</text>
    <text x="1060" y="500" font-size="9" fill="#061009">· Dùng cho xóa vùng (LezZone) và xóa quy định (PolicyRule)</text>
    <text x="1060" y="516" font-size="9" fill="#061009">· Cảnh báo rõ hậu quả cascade trước khi cho phép bấm “Xóa”</text>
    <text x="1060" y="532" font-size="9" fill="#061009">· Sau xóa: toast “Đã xóa…” + danh sách reload + Planner refresh</text>
    <text x="1060" y="548" font-size="9" fill="#061009">· Esc / click nền = Hủy</text>
  </g>

  <!-- ============ TOASTS ============ -->
  <g id="toasts">
    <rect x="60" y="690" width="660" height="230" rx="14" fill="#FFFFFF" stroke="#D7E1D9"/>
    <text x="84" y="718" font-size="12" font-weight="700" fill="#061009">Toast (góc phải-dưới, tự ẩn sau ~4s)</text>
    <rect x="360" y="736" width="330" height="44" rx="10" fill="#061009"/>
    <circle cx="384" cy="758" r="9" fill="#22C55E"/>
    <path d="M380 758 L383 761 L389 754" stroke="#FFFFFF" stroke-width="1.8" fill="none"/>
    <text x="402" y="754" font-size="10" font-weight="600" fill="#FFFFFF">Đã ghi nhận lựa chọn của bạn</text>
    <text x="402" y="770" font-size="8.5" fill="#B8C4BB">Cảm ơn bạn đã góp phần làm Hà Nội trong lành hơn</text>
    <rect x="360" y="790" width="330" height="44" rx="10" fill="#061009"/>
    <circle cx="384" cy="812" r="9" fill="#DC2626"/>
    <path d="M380 808 L388 816 M388 808 L380 816" stroke="#FFFFFF" stroke-width="1.8"/>
    <text x="402" y="808" font-size="10" font-weight="600" fill="#FFFFFF">Không thể lưu trọng số</text>
    <text x="402" y="824" font-size="8.5" fill="#B8C4BB">Tổng 7 trọng số phải đúng 100 (hiện 95)</text>
    <rect x="360" y="844" width="330" height="44" rx="10" fill="#061009"/>
    <circle cx="384" cy="866" r="9" fill="#0D9488"/>
    <path d="M380 866 L388 866 M384 862 L384 870" stroke="#FFFFFF" stroke-width="1.6"/>
    <text x="402" y="862" font-size="10" font-weight="600" fill="#FFFFFF">Đã làm mới dữ liệu chất lượng không khí</text>
    <text x="402" y="878" font-size="8.5" fill="#B8C4BB">Nguồn: Open-Meteo · lớp bản đồ được vẽ lại</text>
    <text x="84" y="748" font-size="9.5" fill="#606D64">• Thành công: chấm xanh #22C55E</text>
    <text x="84" y="770" font-size="9.5" fill="#606D64">• Lỗi: chấm đỏ #DC2626 — kèm nguyên nhân</text>
    <text x="84" y="792" font-size="9.5" fill="#606D64">• Thông tin: chấm teal #0D9488</text>
    <text x="84" y="814" font-size="9.5" fill="#606D64">• Nền #061009, chữ trắng, bo 10px, đổ bóng</text>
    <text x="84" y="836" font-size="9.5" fill="#606D64">• Vị trí: bottom-right, cách mép 16px, chồng lên nhau</text>
    <text x="84" y="858" font-size="9.5" fill="#606D64">• Có nút × để tắt sớm; aria-live="polite"</text>
    <text x="84" y="884" font-size="9" fill="#8CA092">Ghi lựa chọn ⑦ · lưu trọng số ⑬ · làm mới AQI / zones</text>
  </g>

  <!-- ============ TOOLTIP SPEC ============ -->
  <g id="tooltip-spec">
    <rect x="760" y="690" width="620" height="230" rx="14" fill="#FFFFFF" stroke="#D7E1D9"/>
    <text x="784" y="718" font-size="12" font-weight="700" fill="#061009">Tooltip bản đồ (hover vùng AQI — bước ③)</text>
    <rect x="820" y="740" width="180" height="40" rx="10" fill="#061009"/>
    <text x="832" y="758" font-size="10.5" font-weight="600" fill="#FFFFFF">AQI 132 · Kém</text>
    <text x="832" y="772" font-size="8.5" fill="#B8C4BB">PM2.5 48 · PM10 76 µg/m³</text>
    <path d="M900 780 L910 792 L920 780 Z" fill="#061009"/>
    <circle cx="910" cy="806" r="16" fill="#F97316" opacity="0.55"/>
    <circle cx="910" cy="806" r="10" fill="#F97316" opacity="0.8"/>
    <text x="946" y="800" font-size="9" fill="#606D64">↑ con trỏ</text>
    <text x="784" y="850" font-size="9.5" fill="#606D64">• Nền #061009 (90%), chữ trắng, bo 10px, mũi tên chỉ xuống vùng</text>
    <text x="784" y="870" font-size="9.5" fill="#606D64">• Xuất hiện ~150ms khi rê vào vùng, bám theo vị trí vùng đó</text>
    <text x="784" y="890" font-size="9.5" fill="#606D64">• Vùng đang hover: nâng nhẹ (scale ~1.03) + đậm màu + viền sáng</text>
    <text x="784" y="910" font-size="9.5" fill="#606D64">• Ẩn ngay khi rời chuột — không chặn thao tác bản đồ</text>
    <text x="1110" y="850" font-size="9.5" fill="#606D64">• Nội dung: AQI + nhãn băng (Tốt → Nguy hại)</text>
    <text x="1110" y="870" font-size="9.5" fill="#606D64">• Chỉ hiển thị — click mới mở dialog ①</text>
    <text x="1110" y="890" font-size="9.5" fill="#606D64">• Mobile: chạm giữ = tooltip · chạm nhanh = dialog</text>
    <text x="1110" y="910" font-size="9.5" fill="#606D64">• role="tooltip", không giữ focus</text>
  </g>

  <!-- ============ A11Y STRIP ============ -->
  <g id="a11y">
    <rect x="60" y="950" width="1320" height="86" rx="14" fill="#E8F7EC" stroke="#B9DFC6"/>
    <text x="84" y="978" font-size="11" font-weight="700" fill="#09311B">QUY TẮC CHUNG CHO MỌI HỘP THOẠI</text>
    <text x="84" y="1000" font-size="9.5" fill="#09311B">role="dialog" + aria-modal="true" · bắt focus khi mở, trả focus khi đóng · Esc và click nền ngoài đều đóng · nút × có aria-label “Đóng” ·</text>
    <text x="84" y="1018" font-size="9.5" fill="#09311B">nền lùi màu #061009 32% che nội dung bên dưới · z-index trên header (z-50) · nội dung cuộn được khi cao hơn màn hình (max-h + overflow-y-auto).</text>
  </g>
</svg>
