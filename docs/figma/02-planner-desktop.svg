      <text x="1334" y="36" font-size="12.5" font-weight="500" fill="#606D64" text-anchor="middle">Quản trị</text>
    </g>
  </g>

  <!-- ================= HERO ================= -->
  <g id="hero-band">
    <rect x="24" y="80" width="1392" height="96" rx="16" fill="url(#heroGrad)" stroke="#D7E1D9"/>
    <circle cx="62" cy="112" r="14" fill="#D7F4DC"/><path d="M62 118 C62 112 66 108 72 107 C72 114 68 118 62 118 Z M56 118 C56 114 53 111 50 110 C51 115 53 118 56 118 Z" fill="#00884B"/>
    <text x="88" y="114" font-size="20" font-weight="700" fill="#061009">Lựa chọn thông minh vì một Hà Nội trong lành hơn</text>
    <text x="88" y="138" font-size="11.5" fill="#606D64">RideShift là nền tảng hỗ trợ ra quyết định giao thông dựa trên GIS: tính toán tuyến đường, kiểm tra khả năng tuân thủ vùng phát thải thấp (LEZ),</text>
    <text x="88" y="155" font-size="11.5" fill="#606D64">hiển thị chất lượng không khí theo thời gian thực và xếp hạng các phương án di chuyển bằng mô hình ra quyết định đa tiêu chí.</text>
  </g>

