<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1130" viewBox="0 0 1520 1130" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <rect id="page-bg" width="1520" height="1130" fill="#F8FBF8"/>

  <text x="60" y="42" font-size="24" font-weight="700" fill="#061009">RideShift — Sơ đồ CSDL: bảng · khóa · ràng buộc (ERD)</text>
  <text x="60" y="66" font-size="12" fill="#606D64">Ký hiệu: (k) = thuộc tính khóa (đậm = khóa chính PK · mũi tên → = khóa ngoại FK) · 1..1 / 1..n / 0..n = cardinality · Constraint = ràng buộc toàn vẹn · khớp prisma/schema.prisma</text>
  <rect x="1240" y="26" width="220" height="26" rx="13" fill="#D7F4DC"/>
  <text x="1350" y="43" font-size="10.5" font-weight="600" fill="#09311B" text-anchor="middle">SQLite + Prisma 6 · db/custom.db</text>

  <!-- ==================== AdminUser ==================== -->
  <g id="tbl-adminuser">
    <rect x="60" y="90" width="340" height="146" rx="6" fill="#FFFFFF" stroke="#2F6B4F" stroke-width="1.4"/>
    <rect x="60" y="90" width="340" height="26" rx="6" fill="#D7F4DC"/>
    <rect x="60" y="104" width="340" height="12" fill="#D7F4DC"/>
    <text x="230" y="108" font-size="12.5" font-weight="700" fill="#09311B" text-anchor="middle">AdminUser</text>
    <line x1="60" y1="116" x2="400" y2="116" stroke="#2F6B4F"/>
    <text x="72" y="134" font-size="11"><tspan font-weight="700" fill="#00884B">(k) </tspan><tspan fill="#061009">id</tspan><tspan fill="#8CA092"> : String (cuid) — PK</tspan></text>
    <text x="72" y="154" font-size="11"><tspan fill="#061009">username</tspan><tspan fill="#8CA092"> : String</tspan></text>
    <text x="72" y="174" font-size="11"><tspan fill="#061009">passwordHash</tspan><tspan fill="#8CA092"> : String</tspan></text>
    <text x="72" y="194" font-size="11"><tspan fill="#061009">fullName</tspan><tspan fill="#8CA092"> : String?</tspan></text>
    <text x="72" y="214" font-size="11"><tspan fill="#061009">createdAt</tspan><tspan fill="#8CA092"> : DateTime</tspan></text>
    <text x="72" y="230" font-size="10" font-style="italic" fill="#B45309">Constraint: UNIQUE (username)</text>
  </g>

  <!-- ==================== AdminSession ==================== -->
  <g id="tbl-adminsession">
    <rect x="560" y="90" width="380" height="166" rx="6" fill="#FFFFFF" stroke="#2F6B4F" stroke-width="1.4"/>
    <rect x="560" y="90" width="380" height="26" rx="6" fill="#D7F4DC"/>
    <rect x="560" y="104" width="380" height="12" fill="#D7F4DC"/>
    <text x="750" y="108" font-size="12.5" font-weight="700" fill="#09311B" text-anchor="middle">AdminSession</text>
    <line x1="560" y1="116" x2="940" y2="116" stroke="#2F6B4F"/>
    <text x="572" y="134" font-size="11"><tspan font-weight="700" fill="#00884B">(k) </tspan><tspan fill="#061009">id</tspan><tspan fill="#8CA092"> : String (cuid) — PK</tspan></text>
    <text x="572" y="154" font-size="11"><tspan fill="#061009">token</tspan><tspan fill="#8CA092"> : String</tspan></text>
    <text x="572" y="174" font-size="11"><tspan font-weight="700" fill="#00884B">(k) </tspan><tspan fill="#061009">userId</tspan><tspan fill="#0D9488"> : String → AdminUser.id</tspan></text>
    <text x="572" y="194" font-size="11"><tspan fill="#061009">expiresAt</tspan><tspan fill="#8CA092"> : DateTime</tspan></text>
    <text x="572" y="214" font-size="11"><tspan fill="#061009">createdAt</tspan><tspan fill="#8CA092"> : DateTime</tspan></text>
    <text x="572" y="230" font-size="10" font-style="italic" fill="#B45309">Constraint: UNIQUE (token)</text>
    <text x="572" y="246" font-size="10" font-style="italic" fill="#B45309">Constraint: userId — onDelete = Cascade</text>
  </g>

  <!-- ==================== CriteriaWeight ==================== -->
  <g id="tbl-criteriaweight">
    <rect x="1080" y="90" width="380" height="146" rx="6" fill="#FFFFFF" stroke="#2F6B4F" stroke-width="1.4"/>
    <rect x="1080" y="90" width="380" height="26" rx="6" fill="#D7F4DC"/>
    <rect x="1080" y="104" width="380" height="12" fill="#D7F4DC"/>
    <text x="1270" y="108" font-size="12.5" font-weight="700" fill="#09311B" text-anchor="middle">CriteriaWeight</text>
    <line x1="1080" y1="116" x2="1460" y2="116" stroke="#2F6B4F"/>
    <text x="1092" y="134" font-size="11"><tspan font-weight="700" fill="#00884B">(k) </tspan><tspan fill="#061009">id</tspan><tspan fill="#8CA092"> : String (cuid) — PK</tspan></text>
    <text x="1092" y="154" font-size="11"><tspan fill="#061009">criterion</tspan><tspan fill="#8CA092"> : String</tspan></text>
    <text x="1092" y="174" font-size="11"><tspan fill="#061009">weight</tspan><tspan fill="#8CA092"> : Float</tspan></text>
    <text x="1092" y="194" font-size="11"><tspan fill="#061009">label</tspan><tspan fill="#8CA092"> : String</tspan></text>
    <text x="1092" y="214" font-size="10" font-style="italic" fill="#B45309">Constraint: UNIQUE (criterion)</text>
    <text x="1092" y="230" font-size="10" font-style="italic" fill="#B45309">Constraint: tổng weight 7 dòng = 100</text>
  </g>

  <!-- ==================== LezZone ==================== -->
  <g id="tbl-lezzone">
    <rect x="60" y="350" width="340" height="146" rx="6" fill="#FFFFFF" stroke="#2F6B4F" stroke-width="1.4"/>
    <rect x="60" y="350" width="340" height="26" rx="6" fill="#D7F4DC"/>
    <rect x="60" y="364" width="340" height="12" fill="#D7F4DC"/>
    <text x="230" y="368" font-size="12.5" font-weight="700" fill="#09311B" text-anchor="middle">LezZone</text>
    <line x1="60" y1="376" x2="400" y2="376" stroke="#2F6B4F"/>
    <text x="72" y="394" font-size="11"><tspan font-weight="700" fill="#00884B">(k) </tspan><tspan fill="#061009">id</tspan><tspan fill="#8CA092"> : String (cuid) — PK</tspan></text>
    <text x="72" y="414" font-size="11"><tspan fill="#061009">name</tspan><tspan fill="#8CA092"> : String</tspan></text>
    <text x="72" y="434" font-size="11"><tspan fill="#061009">description</tspan><tspan fill="#8CA092"> : String?</tspan></text>
    <text x="72" y="454" font-size="11"><tspan fill="#061009">coordinates</tspan><tspan fill="#8CA092"> : String (JSON [lat,lng][])</tspan></text>
    <text x="72" y="474" font-size="11"><tspan fill="#061009">active</tspan><tspan fill="#8CA092"> : Boolean = true</tspan></text>
    <text x="72" y="490" font-size="10" font-style="italic" fill="#B45309">createdAt / updatedAt : DateTime</text>
  </g>

  <!-- ==================== PolicyRule ==================== -->
  <g id="tbl-policyrule">
    <rect x="560" y="330" width="380" height="246" rx="6" fill="#FFFFFF" stroke="#2F6B4F" stroke-width="1.4"/>
    <rect x="560" y="330" width="380" height="26" rx="6" fill="#D7F4DC"/>
    <rect x="560" y="344" width="380" height="12" fill="#D7F4DC"/>
    <text x="750" y="348" font-size="12.5" font-weight="700" fill="#09311B" text-anchor="middle">PolicyRule  (bảng nối LezZone ⇄ TransportMode)</text>
    <line x1="560" y1="356" x2="940" y2="356" stroke="#2F6B4F"/>
    <text x="572" y="374" font-size="11"><tspan font-weight="700" fill="#00884B">(k) </tspan><tspan fill="#061009">id</tspan><tspan fill="#8CA092"> : String (cuid) — PK</tspan></text>
    <text x="572" y="394" font-size="11"><tspan font-weight="700" fill="#00884B">(k) </tspan><tspan fill="#061009">zoneId</tspan><tspan fill="#0D9488"> : String → LezZone.id</tspan></text>
    <text x="572" y="414" font-size="11"><tspan font-weight="700" fill="#00884B">(k) </tspan><tspan fill="#061009">modeId</tspan><tspan fill="#0D9488"> : String → TransportMode.id</tspan></text>
    <text x="572" y="434" font-size="11"><tspan fill="#061009">restrictionType</tspan><tspan fill="#8CA092"> : String 'banned'|'conditional'</tspan></text>
    <text x="572" y="454" font-size="11"><tspan fill="#061009">condition</tspan><tspan fill="#8CA092"> : String?</tspan></text>
    <text x="572" y="474" font-size="11"><tspan fill="#061009">startTime</tspan><tspan fill="#8CA092"> : String 'HH:mm'</tspan></text>
    <text x="572" y="494" font-size="11"><tspan fill="#061009">endTime</tspan><tspan fill="#8CA092"> : String 'HH:mm'</tspan></text>
    <text x="572" y="514" font-size="11"><tspan fill="#061009">days</tspan><tspan fill="#8CA092"> : String CSV 'Mon,Tue,…'</tspan></text>
    <text x="572" y="534" font-size="11"><tspan fill="#061009">active</tspan><tspan fill="#8CA092"> : Boolean = true</tspan></text>
    <text x="572" y="554" font-size="10" font-style="italic" fill="#B45309">createdAt : DateTime</text>
    <text x="572" y="568" font-size="10" font-style="italic" fill="#B45309">Constraint: 2 FK đều onDelete = Cascade</text>
  </g>

  <!-- ==================== TransportMode ==================== -->
  <g id="tbl-transportmode">
    <rect x="1080" y="330" width="380" height="286" rx="6" fill="#FFFFFF" stroke="#2F6B4F" stroke-width="1.4"/>
    <rect x="1080" y="330" width="380" height="26" rx="6" fill="#D7F4DC"/>
    <rect x="1080" y="344" width="380" height="12" fill="#D7F4DC"/>
    <text x="1270" y="348" font-size="12.5" font-weight="700" fill="#09311B" text-anchor="middle">TransportMode</text>
    <line x1="1080" y1="356" x2="1460" y2="356" stroke="#2F6B4F"/>
    <text x="1092" y="374" font-size="11"><tspan font-weight="700" fill="#00884B">(k) </tspan><tspan fill="#061009">id</tspan><tspan fill="#8CA092"> : String — PK thủ công ('bus'…)</tspan></text>
    <text x="1092" y="394" font-size="11"><tspan fill="#061009">name / description / icon</tspan><tspan fill="#8CA092"> : String</tspan></text>
    <text x="1092" y="414" font-size="11"><tspan fill="#061009">avgSpeedKmh</tspan><tspan fill="#8CA092"> : Float</tspan></text>
    <text x="1092" y="434" font-size="11"><tspan fill="#061009">baseCostVnd / costPerKmVnd</tspan><tspan fill="#8CA092"> : Float</tspan></text>
    <text x="1092" y="454" font-size="11"><tspan fill="#061009">co2PerKmG</tspan><tspan fill="#8CA092"> : Float</tspan></text>
    <text x="1092" y="474" font-size="11"><tspan fill="#061009">baseAccessibility</tspan><tspan fill="#8CA092"> : Float 0–1</tspan></text>
    <text x="1092" y="494" font-size="11"><tspan fill="#061009">baseConvenience</tspan><tspan fill="#8CA092"> : Float 0–1</tspan></text>
    <text x="1092" y="514" font-size="11"><tspan fill="#061009">waitMinutes</tspan><tspan fill="#8CA092"> : Float = 0</tspan></text>
    <text x="1092" y="534" font-size="11"><tspan fill="#061009">enabled</tspan><tspan fill="#8CA092"> : Boolean = true</tspan></text>
    <text x="1092" y="554" font-size="11"><tspan fill="#061009">sortOrder</tspan><tspan fill="#8CA092"> : Int = 0</tspan></text>
    <text x="1092" y="574" font-size="10" font-style="italic" fill="#B45309">Constraint: PK dạng slug nghiệp vụ</text>
    <text x="1092" y="590" font-size="10" font-style="italic" fill="#B45309">7 dòng seed: xe máy xăng/điện, ô tô, buýt, taxi, xe đạp, đi bộ</text>
  </g>

  <!-- ==================== TransportationLocation ==================== -->
  <g id="tbl-location">
    <rect x="60" y="660" width="340" height="146" rx="6" fill="#FFFFFF" stroke="#2F6B4F" stroke-width="1.4"/>
    <rect x="60" y="660" width="340" height="26" rx="6" fill="#D7F4DC"/>
    <rect x="60" y="674" width="340" height="12" fill="#D7F4DC"/>
    <text x="230" y="678" font-size="12.5" font-weight="700" fill="#09311B" text-anchor="middle">TransportationLocation</text>
    <line x1="60" y1="686" x2="400" y2="686" stroke="#2F6B4F"/>
    <text x="72" y="704" font-size="11"><tspan font-weight="700" fill="#00884B">(k) </tspan><tspan fill="#061009">id</tspan><tspan fill="#8CA092"> : String (cuid) — PK</tspan></text>
    <text x="72" y="724" font-size="11"><tspan fill="#061009">name</tspan><tspan fill="#8CA092"> : String</tspan></text>
    <text x="72" y="744" font-size="11"><tspan fill="#061009">type</tspan><tspan fill="#8CA092"> : String 'bus_stop'|'metro'|'brt'</tspan></text>
    <text x="72" y="764" font-size="11"><tspan fill="#061009">lat / lng</tspan><tspan fill="#8CA092"> : Float</tspan></text>
    <text x="72" y="784" font-size="11"><tspan fill="#061009">active</tspan><tspan fill="#8CA092"> : Boolean = true</tspan></text>
    <text x="72" y="800" font-size="10" font-style="italic" fill="#B45309">Điểm gợi ý: bến xe, ga metro, điểm BRT (12 seed)</text>
  </g>

  <!-- ==================== TripRecord ==================== -->
  <g id="tbl-triprecord">
    <rect x="560" y="660" width="420" height="346" rx="6" fill="#FFFFFF" stroke="#2F6B4F" stroke-width="1.4"/>
    <rect x="560" y="660" width="420" height="26" rx="6" fill="#D7F4DC"/>
    <rect x="560" y="674" width="420" height="12" fill="#D7F4DC"/>
    <text x="770" y="678" font-size="12.5" font-weight="700" fill="#09311B" text-anchor="middle">TripRecord  (lịch sử chuyến — nguồn dữ liệu analytics)</text>
    <line x1="560" y1="686" x2="980" y2="686" stroke="#2F6B4F"/>
    <text x="572" y="704" font-size="11"><tspan font-weight="700" fill="#00884B">(k) </tspan><tspan fill="#061009">id</tspan><tspan fill="#8CA092"> : String (cuid) — PK</tspan></text>
    <text x="572" y="724" font-size="11"><tspan fill="#061009">originName / destName / originDistrict</tspan><tspan fill="#8CA092"> : String</tspan></text>
    <text x="572" y="744" font-size="11"><tspan fill="#061009">originLat / originLng / destLat / destLng</tspan><tspan fill="#8CA092"> : Float</tspan></text>
    <text x="572" y="764" font-size="11"><tspan fill="#061009">distanceKm / durationMin</tspan><tspan fill="#8CA092"> : Float</tspan></text>
    <text x="572" y="784" font-size="11"><tspan font-weight="700" fill="#00884B">(k) </tspan><tspan fill="#061009">vehicleId</tspan><tspan fill="#0D9488"> : String → TransportMode.id ①</tspan></text>
    <text x="572" y="804" font-size="11"><tspan fill="#061009">purpose</tspan><tspan fill="#8CA092"> : String work|school|shopping|leisure|other</tspan></text>
    <text x="572" y="824" font-size="11"><tspan fill="#061009">departureHour</tspan><tspan fill="#8CA092"> : Int 0–23</tspan></text>
    <text x="572" y="844" font-size="11"><tspan fill="#061009">lezAffected</tspan><tspan fill="#8CA092"> : Boolean</tspan></text>
    <text x="572" y="864" font-size="11"><tspan font-weight="700" fill="#00884B">(k) </tspan><tspan fill="#061009">topModeId</tspan><tspan fill="#0D9488"> : String → TransportMode.id ①</tspan></text>
    <text x="572" y="884" font-size="11"><tspan fill="#061009">topScore</tspan><tspan fill="#8CA092"> : Float 0–1</tspan></text>
    <text x="572" y="904" font-size="11"><tspan fill="#061009">avgCostVnd / avgTimeMin</tspan><tspan fill="#8CA092"> : Float</tspan></text>
    <text x="572" y="924" font-size="11"><tspan font-weight="700" fill="#00884B">(k) </tspan><tspan fill="#061009">chosenModeId</tspan><tspan fill="#0D9488"> : String? → TransportMode.id ①</tspan></text>
    <text x="572" y="944" font-size="11"><tspan fill="#061009">switched</tspan><tspan fill="#8CA092"> : Boolean = false</tspan></text>
    <text x="572" y="964" font-size="10" font-style="italic" fill="#B45309">createdAt : DateTime</text>
    <text x="572" y="980" font-size="10" font-style="italic" fill="#B45309">Constraint: ① khóa logic — không FK vật lý, giữ lịch sử</text>
    <text x="572" y="994" font-size="10" font-style="italic" fill="#B45309">kể cả khi TransportMode bị xóa</text>
  </g>

  <!-- ==================== AirQualityCache ==================== -->
  <g id="tbl-aqcache">
    <rect x="1080" y="700" width="380" height="146" rx="6" fill="#FFFFFF" stroke="#2F6B4F" stroke-width="1.4"/>
    <rect x="1080" y="700" width="380" height="26" rx="6" fill="#D7F4DC"/>
    <rect x="1080" y="714" width="380" height="12" fill="#D7F4DC"/>
    <text x="1270" y="718" font-size="12.5" font-weight="700" fill="#09311B" text-anchor="middle">AirQualityCache  (độc lập)</text>
    <line x1="1080" y1="726" x2="1460" y2="726" stroke="#2F6B4F"/>
    <text x="1092" y="744" font-size="11"><tspan font-weight="700" fill="#00884B">(k) </tspan><tspan fill="#061009">id</tspan><tspan fill="#8CA092"> : String (cuid) — PK</tspan></text>
    <text x="1092" y="764" font-size="11"><tspan fill="#061009">cacheKey</tspan><tspan fill="#8CA092"> : String</tspan></text>
    <text x="1092" y="784" font-size="11"><tspan fill="#061009">payload</tspan><tspan fill="#8CA092"> : String (JSON)</tspan></text>
    <text x="1092" y="804" font-size="11"><tspan fill="#061009">fetchedAt</tspan><tspan fill="#8CA092"> : DateTime</tspan></text>
    <text x="1092" y="824" font-size="10" font-style="italic" fill="#B45309">Constraint: UNIQUE (cacheKey)</text>
    <text x="1092" y="840" font-size="10" font-style="italic" fill="#B45309">TTL: 30' (điểm, thời tiết) · 24h (lưới AQI) · 30d (ranh giới)</text>
  </g>

  <!-- ==================== EDGES ==================== -->
  <!-- AdminUser 1..1 — 1..n AdminSession -->
  <line x1="400" y1="160" x2="560" y2="160" stroke="#061009" stroke-width="1.5"/>
  <rect x="404" y="146" width="34" height="15" fill="#F8FBF8"/>
  <text x="406" y="158" font-size="10.5" font-weight="700" fill="#061009">1..1</text>
  <rect x="520" y="146" width="34" height="15" fill="#F8FBF8"/>
  <text x="522" y="158" font-size="10.5" font-weight="700" fill="#061009">1..n</text>

  <!-- LezZone 1..1 — 1..n PolicyRule -->
  <line x1="400" y1="420" x2="560" y2="420" stroke="#061009" stroke-width="1.5"/>
  <rect x="404" y="406" width="34" height="15" fill="#F8FBF8"/>
  <text x="406" y="418" font-size="10.5" font-weight="700" fill="#061009">1..1</text>
  <rect x="520" y="406" width="34" height="15" fill="#F8FBF8"/>
  <text x="522" y="418" font-size="10.5" font-weight="700" fill="#061009">1..n</text>

  <!-- TransportMode 1..1 — 1..n PolicyRule -->
  <line x1="940" y1="450" x2="1080" y2="450" stroke="#061009" stroke-width="1.5"/>
  <rect x="946" y="436" width="34" height="15" fill="#F8FBF8"/>
  <text x="948" y="448" font-size="10.5" font-weight="700" fill="#061009">1..n</text>
  <rect x="1040" y="436" width="34" height="15" fill="#F8FBF8"/>
  <text x="1042" y="448" font-size="10.5" font-weight="700" fill="#061009">1..1</text>

  <!-- TransportMode 1..1 — 0..n TripRecord (logical, dashed) -->
  <path d="M 1270 616 L 1270 628 L 1010 628 L 1010 700 L 984 700" fill="none" stroke="#606D64" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1262" y="622" font-size="10.5" font-weight="700" fill="#061009" text-anchor="end">1..1</text>
  <text x="1018" y="690" font-size="10.5" font-weight="700" fill="#061009">0..n</text>
  <text x="1140" y="648" font-size="9.5" font-style="italic" fill="#606D64" text-anchor="middle">liên kết logic: vehicleId · topModeId · chosenModeId</text>

  <!-- ==================== LEGEND ==================== -->
  <g id="erd-legend">
    <rect x="60" y="1040" width="1400" height="64" rx="10" fill="#FFFFFF" stroke="#D7E1D9"/>
    <text x="80" y="1064" font-size="10.5"><tspan font-weight="700" fill="#00884B">(k)</tspan><tspan fill="#061009"> = thuộc tính khóa — in đậm: khóa chính (PK) · mũi tên </tspan><tspan font-weight="700" fill="#0D9488">→</tspan><tspan fill="#061009"> : khóa ngoại (FK) tham chiếu</tspan></text>
    <text x="80" y="1084" font-size="10.5" fill="#061009">1..1 · 1..n · 0..n = tính đa chiều của quan hệ  ·  đường nét đứt = liên kết logic phía ứng dụng (không tạo FK trong SQLite)</text>
    <text x="820" y="1064" font-size="10.5" font-style="italic" fill="#B45309">Constraint: … = ràng buộc toàn vẹn (UNIQUE / Cascade / miền giá trị / quy tắc nghiệp vụ)</text>
    <text x="820" y="1084" font-size="10.5" fill="#061009">Tổng: 9 bảng · 3 FK vật lý (đều Cascade) · 4 UNIQUE · 3 liên kết logic TripRecord ↔ TransportMode</text>
  </g>
</svg>
